<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acme Studios — Customer Onboarding Dashboard</title>
  <meta name="description" content="A customer onboarding dashboard for a digital agency: manage clients, track projects, monitor onboarding, handle requests, and organize files — all in one place.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%234f46e5'/><text x='50' y='68' font-size='58' font-family='Arial' font-weight='bold' fill='white' text-anchor='middle'>A</text></svg>">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo">A</div>
        <div>
          <div class="brand-name">Acme Studios</div>
          <div class="brand-sub">Client OS</div>
        </div>
      </div>
      <div class="nav-label">Workspace</div>
      <nav id="nav"></nav>
      <div class="sidebar-foot">
        <div class="help-card">
          <b>Demo workspace</b>
          Sample data lives in your browser.
          <a href="javascript:void(0)" onclick="resetDemo()" style="color:var(--brand-400);font-weight:600;display:inline-block;margin-top:8px">Reset demo data →</a>
        </div>
      </div>
    </aside>

    <!-- Main -->
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content" id="content"></main>
    </div>
  </div>

  <div id="modalRoot"></div>
  <div class="toast-wrap" id="toastWrap"></div>

  <script src="assets/js/icons.js"></script>
  <script src="assets/js/seed.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
